[build]
  command = "echo 'Build concluído — site estático com Netlify Functions'"
  publish = "public"
  functions = "netlify/functions"

# Redireciona TODAS as requisições da API para a Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Redireciona rotas de páginas (SPA-like para arquivos HTML)
[[redirects]]
  from = "/crianca"
  to = "/crianca.html"
  status = 200

[[redirects]]
  from = "/adulto"
  to = "/adulto.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Headers de segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
